name: RouteGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile check
        run: python -m py_compile routeguard/*.py api/*.py dashboard/*.py benchmarks/*.py tests/*.py
      - name: Run unit, circuit breaker, and eval harness tests
        run: pytest -v
      - name: Run 60-case regression benchmark
        run: python benchmarks/run_benchmark.py --out-dir data_runtime/bench_ci
