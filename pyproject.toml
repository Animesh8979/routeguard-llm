[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "routeguard-llm"
version = "0.1.0"
description = "Deterministic LLM cost-routing proxy with Pydantic v2 self-healing schema repair, semantic WAL cache, circuit breakers, and 60-case regression harness"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Animesh Shukla", email = "anishukla.2003@gmail.com" },
]
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "streamlit>=1.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["routeguard*", "api*", "dashboard*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
