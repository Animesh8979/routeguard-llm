[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "routeguard-llm"
version = "0.1.0"
description = "OpenAI-compatible FastAPI LLM cost-routing proxy with SSE streaming, entropy-margin routing, Pydantic v2 schema repair, WAL semantic cache & RouterBench OOD eval"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Animesh Shukla", email = "anishukla.2003@gmail.com" },
]
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "streamlit>=1.32",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["routeguard*", "api*", "dashboard*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
